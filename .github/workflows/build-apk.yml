name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "ERROR: JAVA_HOME is not set."
            exit 1
          fi

          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Unable to detect Java major version from output:"
            echo "$JAVA_VERSION_OUTPUT"
            exit 1
          fi

          echo "Detected Java Major Version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Java version must be 17 or higher. Detected version: $JAVA_MAJOR"
            exit 1
          fi

          echo "Java environment verification successful (Java $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists. Skipping generation."
          else
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to locate or generate debug.keystore!"
            exit 1
          fi

          echo "Temporary debug keystore verified."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected debug APK not found at $EXPECTED_APK"
            echo "Searching inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK is an empty file (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: $EXPECTED_APK does not have the .apk extension."
              exit 1
              ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Selected APK is not app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "Debug APK verified successfully: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_ASSET_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$TEMP_ASSET_DIR"

          RAW_REPO_NAME="${{ github.repository }}"
          REPO_NAME=$(basename "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9._-]/-/g')
          
          RELEASE_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_PATH="${TEMP_ASSET_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEST_PATH"

          if [ ! -f "$DEST_PATH" ] || [ ! -s "$DEST_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $DEST_PATH"
            exit 1
          fi

          echo "Release asset prepared: $DEST_PATH ($RELEASE_FILENAME)"
          echo "asset_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset does not exist or is empty at $ASSET_PATH"
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset does not have .apk extension: $ASSET_PATH"
              exit 1
              ;;
          esac

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Automated Debug APK Release

          - **Build System**: Built by GitHub Actions
          - **Run Number**: #${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: \`${{ github.sha }}\`
          - **Intended Use**: Testing and evaluation only
          - **Release Type**: Automated debug build (not a Google Play Store production release)
          - **Signing**: Signed with a temporary debug keystore
          EOF
          )

          echo "Creating release $TAG with asset $ASSET_PATH..."
          gh release create "$TAG" \
            "$ASSET_PATH" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          RELEASE_URL="${REPO_URL}/releases/tag/${TAG}"

          echo "=========================================="
          echo "         WORKFLOW EXECUTION SUMMARY       "
          echo "=========================================="

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release Status: SUCCESS"
            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Direct Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            echo "APK is available for direct download under GitHub Releases Assets."
            echo "Actions artifact 'app-debug-apk' is also available as a backup."
            
            gh release view "$TAG" || true

            echo "### 🚀 Debug APK Build & Release Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page**: [$RELEASE_URL]($RELEASE_URL)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Downloadable APK Asset**: \`$ASSET_NAME\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Installation Instructions**: Navigate to the release link above on your Android phone and download \`$ASSET_NAME\` from the **Assets** section." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Backup Artifact**: The standard GitHub Actions artifact **\`app-debug-apk\`** is also available on this run's summary page." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WARNING: GitHub Release publishing could not be completed (Outcome: $RELEASE_OUTCOME)."
            echo "The APK build SUCCEEDED and the artifact 'app-debug-apk' was uploaded successfully."
            echo "You can download the APK from the GitHub Actions Artifacts section."

            echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Notice)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **APK Build**: Successful" >> "$GITHUB_STEP_SUMMARY"
            echo "- **GitHub Actions Artifact**: **\`app-debug-apk\`** is available for download on this run summary page." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Publishing**: Release step did not complete (see step logs), but the built APK artifact was safely preserved." >> "$GITHUB_STEP_SUMMARY"
          fi
